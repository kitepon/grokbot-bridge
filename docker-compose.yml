# grokbot-bridge — shared call bridge MCP for Grok Bot (streamable HTTP)
# Prod deploy name on main-server remains call-bridge.
# Phone book is fetched on every call_directory (no periodic sync, no post-edit push).
# Prod: box directory-live on 127.0.0.1:18765, SSH -R 127.0.0.1:18765 to this host,
# socat unix socket's parent directory mounted below as /run/dirlive.
# Set CALL_BRIDGE_DIRECTORY_UNIX=/run/dirlive/dirlive.sock in .env.
# CALL_BRIDGE_DIRECTORY_URL is the HTTP fallback. directory.json is last resort.
# Do not mount a copied agents tree; it goes stale.
services:
  grokbot-bridge:
    build: .
    image: grokbot-bridge:latest
    container_name: grokbot-bridge
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      # Grok Bot gateway on the host. GROKBOT_GATEWAY_URL=http://host.docker.internal:18766
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18910:18910"
    volumes:
      - ./data:/app/data
      - ./directory.json:/app/directory.json:ro
      # Parent directory of the host socat socket. A recreated socket inode
      # stays visible without recreating the container.
      - ${CALL_BRIDGE_DIRECTORY_UNIX_HOST:-./dirlive}:/run/dirlive
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18910/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
