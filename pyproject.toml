[project]
name = "grokbot-bridge"
version = "0.1.0"
description = "Shared phone-call bridge MCP for Grok Bot — wake a teammate, then talk direct over the same endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kitepon.dev" }]
dependencies = [
    "mcp>=1.2.0,<2",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/kitepon/grokbot-bridge"
Repository = "https://github.com/kitepon/grokbot-bridge"

[project.scripts]
call-bridge = "call_bridge.server:main"
grokbot-bridge = "call_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_bridge"]
